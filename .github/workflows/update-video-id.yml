name: Update YouTube Video ID

on:
  repository_dispatch:
    types: [update-video-id]

jobs:
  update-video-id:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update video ID in HTML
        run: |
          sed -i "s/videoId: '[^']*'/videoId: '${{ github.event.client_payload.video_id }}'/" index.html
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id }}

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "Update YouTube video ID to ${{ github.event.client_payload.video_id }}" || echo "No changes to commit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: |
          git pull --rebase origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push changes
        run: |
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
